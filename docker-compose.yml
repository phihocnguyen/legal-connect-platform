services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    platform: linux/arm64
    container_name: legal-connect-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_connect}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-connect-network

  # Redis - Caching layer for posts and sessions
  redis:
    image: redis:7-alpine
    platform: linux/arm64
    container_name: legal-connect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-connect-network

  # RabbitMQ - Message queue for async tasks
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    platform: linux/arm64
    container_name: legal-connect-rabbitmq
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_ERLANG_COOKIE: legal-connect-erlang-cookie-secure-random-123456789
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-connect-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    platform: linux/arm64
    container_name: legal-connect-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    environment:
      # Enable dev profile for data seeding
      SPRING_PROFILES_ACTIVE: dev

      # Redis configuration - override host to use Docker service
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      # RabbitMQ configuration - override host to use Docker service
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # Python ML service URL (Host machine)
      APP_ML_URL: http://host.docker.internal:8000

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - legal-connect-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
      target: development
    platform: linux/arm64
    container_name: legal-connect-frontend
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true
      # Override API URL để gọi backend trong Docker network
      - NEXT_PUBLIC_API_URL=http://backend:8080/api
    command: npm run dev
    working_dir: /app
    depends_on:
      - backend
    networks:
      - legal-connect-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  frontend_node_modules:
  frontend_next:

networks:
  legal-connect-network:
    driver: bridge
