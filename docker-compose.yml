services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    platform: linux/arm64
    container_name: legal-connect-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_connect}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-connect-network

  # Redis - Caching layer for posts and sessions
  redis:
    image: redis:7-alpine
    platform: linux/arm64
    container_name: legal-connect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-connect-network

  # RabbitMQ - Message queue for async tasks
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    platform: linux/arm64
    container_name: legal-connect-rabbitmq
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_ERLANG_COOKIE: legal-connect-erlang-cookie-secure-random-123456789
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-connect-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    platform: linux/arm64
    container_name: legal-connect-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    environment:
      # Enable dev profile for data seeding
      SPRING_PROFILES_ACTIVE: dev

      # Redis configuration - override host to use Docker service
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      # RabbitMQ configuration - override host to use Docker service
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - legal-connect-network

  python-ml:
    build:
      context: ./python-ml-service
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: legal-connect-python-ml
    ports:
      - "8000:8000"
    environment:
      # Google Gemini API Key (required)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # ChromaDB settings
      - CHROMA_PERSIST_DIR=/app/data/vector_stores
      - COLLECTION_NAME=legal_documents
      # Model settings
      - EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - LLM_MODEL=gemini-pro
      - TEMPERATURE=0.3
      - MAX_TOKENS=2048
      # RAG settings
      - TOP_K=5
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
    volumes:
      - ./python-ml-service/app:/app/app
      - ml_vector_stores:/app/data/vector_stores
    networks:
      - legal-connect-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
      target: deps
    platform: linux/arm64
    container_name: legal-connect-frontend
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ./frontend/components.json:/app/components.json
      - ./frontend/.env.local:/app/.env.local
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      # Override API URL để gọi backend trong Docker network
      - NEXT_PUBLIC_API_URL=http://backend:8080/api
      # Python ML service URL
      - NEXT_PUBLIC_PYTHON_API_URL=http://python-ml:8000

    command: sh -c "npm install && npm run dev"
    working_dir: /app
    depends_on:
      - backend
      - python-ml
    networks:
      - legal-connect-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  frontend_node_modules:
  frontend_next:
  ml_vector_stores:

networks:
  legal-connect-network:
    driver: bridge
